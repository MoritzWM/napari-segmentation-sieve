name: napari-segmentation-sieve
display_name: Segmentation Sieve
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
# categories: []
contributions:
  commands:
    - id: napari-segmentation-sieve.segmentation_sieve_widget
      python_name: napari_segmentation_sieve:SegmentationSieve
      title: Segmentation sieve
    - id: napari-segmentation-sieve.morphology_tools_widget
      python_name: napari_segmentation_sieve:MorphologyTools
      title: Morphology tools
    - id: napari-segmentation-sieve.watershed_widget
      python_name: napari_segmentation_sieve:Watershed
      title: Watershed
  widgets:
    - command: napari-segmentation-sieve.segmentation_sieve_widget
      display_name: Segmentation sieve
    - command: napari-segmentation-sieve.morphology_tools_widget
      display_name: Morphology tools
    - command: napari-segmentation-sieve.watershed_widget
      display_name: Watershed
  menus:
    napari/layers/segment:
      - command: napari-segmentation-sieve.segmentation_sieve_widget
      - command: napari-segmentation-sieve.morphology_tools_widget
      - command: napari-segmentation-sieve.watershed_widget
